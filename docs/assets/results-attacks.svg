<rect x="290" y="300" width="520" height="20" fill="#eef0f3"/><rect x="290" y="300" width="66.2" height="20" fill="#0d6b3a"/><text x="820" y="315" font-size="14" fill="#17181a">12.7%</text>
<rect x="290" y="326" width="520" height="20" fill="#eef0f3"/><rect x="290" y="326" width="520.0" height="20" fill="#a11d1d"/><text x="820" y="341" font-size="14" fill="#17181a">100.0%</text>
