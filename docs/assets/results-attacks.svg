<text x="24" y="256" font-size="15" font-weight="600" fill="#17181a">A2</text><text x="24" y="274" font-size="12" fill="#5b6068">value tier</text>
<rect x="290" y="236" width="520" height="20" fill="#eef0f3"/><rect x="290" y="236" width="100.8" height="20" fill="#0d6b3a"/><text x="820" y="251" font-size="14" fill="#17181a">19.4%</text>
