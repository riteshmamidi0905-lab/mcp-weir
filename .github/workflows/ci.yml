name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test,interop,dev]'
      - name: Freeze verification (the 32 files the evaluation froze are byte-identical to FREEZE.json)
        run: python -m weir_eval.freeze verify
      - run: ruff check src tests eval examples
      - run: ruff format --check src tests eval examples
      - run: mypy

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test,interop]'
      - name: Unit, property, gateway, end-to-end and SDK-interop tests
        run: pytest -q
      - name: Evaluation harness smoke test (scripted agents only, no model)
        run: python -m weir_eval.run --suite smoke --out /tmp/smoke

  control-center:
    name: control-center (backend, server, claim guards, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test,interop]'
      - name: Control Center backend, server, claim-guard and test-count tests
        run: pytest -o addopts= -q tests/test_dashboard_backend.py tests/test_dashboard_server.py tests/test_dashboard_claims.py tests/test_dashboard_counts.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned Playwright (tests/ui/package-lock.json)
        run: npm ci --prefix tests/ui
      - name: Install Chromium only, with its system libraries
        run: node tests/ui/node_modules/playwright/cli.js install --with-deps chromium
      - name: Control Center browser tests (Chromium; a missing prerequisite fails, it does not skip)
        env:
          WEIR_REQUIRE_BROWSER: "1"
        run: pytest -o addopts= -q -rP tests/test_dashboard_ui.py
